<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe Integration Tester</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">

      <!-- ── Sidebar ── -->
      <div class="sidebar">

        <div class="sidebar-logo">
          <div class="logo-mark">iD<span class="dot">now</span><span class="dot">.</span></div>
          <h2>Iframe integration tester</h2>
        </div>

        <!-- URL Settings -->
        <div class="section">
          <div class="section-header">
            <span class="chevron"></span>
            URL Settings
          </div>
          <div class="section-body">
            <div class="field">
              <label for="urlInput">Iframe Source URL:</label>
              <input
                type="url"
                id="urlInput"
                placeholder="https://…"
                value="https://go.dev8.idnow.de/docidv/channel-chooser/web?identToken=DV8-CQGVP"
              />
            </div>
            <button class="btn btn-primary" id="applyUrlBtn">Apply URL</button>
          </div>
        </div>

        <!-- Dimensions -->
        <div class="section">
          <div class="section-header">
            <span class="chevron"></span>
            Dimensions
          </div>
          <div class="section-body">
            <div class="field">
              <label for="heightInput">Height (px)</label>
              <input type="number" id="heightInput" value="900" min="100" />
            </div>
            <div class="field">
              <label for="widthInput">Width (px)</label>
              <input type="number" id="widthInput" value="1200" min="100" />
            </div>
            <button class="btn btn-primary" id="applyDimBtn">Apply</button>
          </div>
        </div>

        <!-- Sandbox Controls -->
        <div class="section">
          <div class="section-header">
            <span class="chevron"></span>
            Sandbox controls
          </div>
          <div class="section-body">
            <a
              class="sandbox-doc-link"
              href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/iframe#sandbox"
              target="_blank"
              rel="noopener"
            >Sandbox documentation</a>

            <label class="checkbox-row">
              <input type="checkbox" id="enableSandbox" checked />
              <span>Enable sandbox attribute</span>
            </label>

            <p class="group-label">Choose sandbox attribute</p>

            <div class="sandbox-attr-list" id="sandboxAttrList">
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-downloads" />
                <span>allow downloads</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-forms" checked />
                <span>allow forms</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-modals" checked />
                <span>allow modals</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-orientation-lock" />
                <span>allow orientation lock</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-pointer-lock" />
                <span>allow pointer lock</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-popups" checked />
                <span>allow popups</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-popups-to-escape-sandbox" />
                <span>allow popups to escape sandbox</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-presentation" />
                <span>allow presentation</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-same-origin" checked />
                <span>allow same origin</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-scripts" checked />
                <span>allow scripts</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-top-navigation" />
                <span>allow top navigation</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="sandbox-cb" value="allow-top-navigation-by-user-activation" />
                <span>allow top navigation by user activation</span>
              </label>
            </div>

            <button class="btn btn-primary" id="applySandboxBtn">Apply</button>
          </div>
        </div>

        <!-- Allow attributes -->
        <div class="section">
          <div class="section-header">
            <span class="chevron"></span>
            Allow attributes
          </div>
          <div class="section-body">
            <p class="group-label">Feature permissions</p>
            <div id="allowAttrList">
              <label class="checkbox-row">
                <input type="checkbox" class="allow-cb" value="camera" checked />
                <span>camera</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="allow-cb" value="microphone" checked />
                <span>microphone</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="allow-cb" value="geolocation" checked />
                <span>geolocation</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="allow-cb" value="fullscreen" checked />
                <span>fullscreen</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="allow-cb" value="clipboard-read" checked />
                <span>clipboard-read</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="allow-cb" value="clipboard-write" checked />
                <span>clipboard-write</span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" class="allow-cb" value="web-share" checked />
                <span>web-share</span>
              </label>
            </div>
            <button class="btn btn-primary" id="applyAllowBtn">Apply</button>
          </div>
        </div>

      </div>
      <!-- /sidebar -->

      <!-- ── Main / iframe area ── -->
      <div class="main">
        <div class="iframe-wrapper">
          <div class="iframe-inner" id="iframeInner">
            <div class="loading" id="loading">
              <div class="spinner"></div>
              <p>Loading…</p>
            </div>
            <iframe
              id="testFrame"
              src="https://go.dev8.idnow.de/docidv/channel-chooser/web?identToken=DV8-CQGVP"
              title="Iframe integration tester"
              allow="camera; microphone; geolocation; fullscreen; clipboard-read; clipboard-write; web-share"
              sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </div>

    </div>

    <script src="app.js"></script>
  </body>
</html>
